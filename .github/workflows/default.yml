name: SonarQube Cloud

on:
  workflow_call:
    inputs:
      projects:
        description: Optional path to the project(s) file to build. Pass empty to have MSBuild use the default behavior. Supports globbing. Default is an empty string.
        required: false
        type: string
      ref:
        description: The branch, tag or SHA to check out. Omit to retain the triggering ref.
        required: false
        type: string
        default: ''
      configuration:
        description: The build configuration. Defaults to Debug to preserve existing callers.
        required: false
        type: string
        default: Debug
      organization:
        description: The name of your organization in SonarQube Cloud.
        required: true
        type: string
      projectKey:
        description: The key of your project in SonarQube Cloud.
        required: true
        type: string
      version:
        description: The version of your project, e.g., 1.0.0.
        required: true
        type: string
      host:
        description: The URL of your SonarQube instance.
        required: false
        type: string
        default: 'https://sonarcloud.io'
      include-preview:
        description: When set to true, includes preview versions of .NET. Default is false.
        required: false
        type: boolean
        default: false
      parameters:
        description: Additional properties to be passed to the scanner. Default is to use properties tailored for C# and the coding conventions followed by Codebelt.
        required: false
        type: string
        default: >-
          -d:sonar.exclusions='**/obj/**,**/bin/**'
      timeout-minutes:
        description: The maximum time in minutes to allow the job to run. Default is 15 minutes.
        required: false
        type: number
        default: 15
      coverage-mode:
        description: Controls how coverage is supplied to SonarQube Cloud. Allowed values are opencover and normalized.
        required: false
        type: string
        default: opencover
      coverage-source-root:
        description: Repository-relative source directory used to normalize workspace paths in normalized mode.
        required: false
        type: string
        default: src
      coverage-partition-regex:
        description: Regex over artifact-relative report paths; capture groups identify build variant and target framework in normalized mode. Every report must match.
        required: false
        type: string
        default: '^([^/]+?)(?:-[0-9a-f]{16,})?/([^/]+)/'
      coverage-max-identity-spread:
        description: Optional caller acceptance guard for cross-partition branch source-line spread. Empty means no threshold.
        required: false
        type: string
        default: ''
    secrets:
      SONAR_TOKEN:
        required: true

jobs:
  sonarcloud:
    name: 🔬 Code Quality Analysis
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Checkout
        if: ${{ inputs.ref == '' }}
        uses: codebeltnet/git-checkout@v1

      - name: Checkout requested ref
        if: ${{ inputs.ref != '' }}
        uses: codebeltnet/git-checkout@v1
        with:
          ref: ${{ inputs.ref }}

      - name: Install .NET
        uses: codebeltnet/install-dotnet@v3
        with:
          includePreview: ${{ inputs.include-preview }}

      - name: Install .NET Tool - Sonar Scanner
        uses: codebeltnet/dotnet-tool-install-sonarscanner@v3

      - name: Restore Dependencies
        uses: codebeltnet/dotnet-restore@v3

      - name: Run SonarQube Cloud Analysis
        uses: codebeltnet/sonarcloud-scan@v2
        with:
          token: ${{ secrets.SONAR_TOKEN }}
          organization: ${{ inputs.organization }}
          projectKey: ${{ inputs.projectKey }}
          version: ${{ inputs.version }}
          host: ${{ inputs.host }}
          parameters: ${{ inputs.parameters }}
          coverage-mode: ${{ inputs.coverage-mode }}
          coverage-source-root: ${{ inputs.coverage-source-root }}
          coverage-partition-regex: ${{ inputs.coverage-partition-regex }}
          coverage-max-identity-spread: ${{ inputs.coverage-max-identity-spread }}

      - name: Build
        uses: codebeltnet/dotnet-build@v4
        with:
          configuration: ${{ inputs.configuration }}
          build-switches: -p:SkipSignAssembly=true
          projects: ${{ inputs.projects }}

      - name: Finalize SonarCloud Analysis
        uses: codebeltnet/sonarcloud-scan-finalize@v1
        with:
          token: ${{ secrets.SONAR_TOKEN }}
